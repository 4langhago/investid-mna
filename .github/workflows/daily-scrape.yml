name: 매물 자동 수집

on:
  schedule:
    # 매일 00:00 UTC = 한국 09:00 / 자카르타 07:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 인도웹 수집이 요청당 12초(사이트 보호)라 30분으로는 부족해졌다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 부동산 매물 수집 (99.co)
        run: python scraper/scrape_99co.py

      # 실패해도 부동산 발송은 계속되어야 하므로 워크플로를 중단시키지 않는다.
      - name: 사업체 인수 매물 수집 (OLX — 주력)
        continue-on-error: true
        run: python scraper/scrape_olx.py

      - name: 사업체 인수 매물 수집 (tempat-usaha.com — 보조)
        continue-on-error: true
        run: python scraper/scrape_business.py

      # 한인 커뮤니티는 추천 1순위 소스다(한국인이 실제로 인수·운영하는 매물).
      # 다만 인도웹은 요청을 조여 실패가 잦으므로 워크플로를 중단시키지는 않는다.
      # 요청 간 12초 딜레이 + 상세 페이지 수집이라 시간이 걸린다(아래 timeout 참고).
      - name: 한인 커뮤니티 매물 수집 (indoweb.org — 1순위)
        continue-on-error: true
        run: python scraper/scrape_indoweb.py --pages 2

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet js/live_data.js js/business_data.js js/olx_data.js js/community_data.js; then
            echo "변경 사항 없음 - 커밋 생략"
            exit 0
          fi
          git add js/live_data.js js/business_data.js js/olx_data.js js/community_data.js
          git commit -m "chore: auto-update listings ($(date -u +%Y-%m-%d))"
          git push

      # 2026-07-27: 발송 소스를 js/data.js(실재 확인 불가) → js/live_data.js(99.co 실수집)로
      # 교체하고 재개함. 반드시 위 '매물 수집' 스텝 뒤에 있어야 한다 —
      # telegram_recommend.py 는 live_data.js 가 48시간 이내 갱신된 경우에만 발송한다.
      - name: 텔레그램 매물 추천 (한인 커뮤니티 2 + 사업체 2 + 부동산)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 없으면 구글 실측 검증만 건너뛰고 나머지는 정상 동작한다.
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scraper/telegram_recommend.py

      # 매물 이력(가격 변동·체류 기간)과 Places 캐시는 실행 간에 유지돼야 의미가 있다.
      # 커밋하지 않으면 매 실행이 '첫 실행'이 되어 추적이 영원히 시작되지 않는다.
      - name: 발송 상태·매물 이력 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in scraper/telegram_state.json \
                   scraper/output/listing_history.json \
                   scraper/output/places_cache.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # 스테이징 후에 판단한다. 이력 파일은 첫 실행에서 '추적되지 않은 새 파일'이라
          # git diff(워킹트리)로는 변경이 안 보이고, 그대로면 영원히 커밋되지 않는다.
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "chore: update rotation state & listing history ($(date -u +%Y-%m-%d))"
          git push
