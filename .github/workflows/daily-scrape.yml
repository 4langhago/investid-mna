name: 매물 자동 수집

on:
  schedule:
    # 매일 00:00 UTC = 한국 09:00 / 자카르타 07:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 부동산 매물 수집 (99.co)
        run: python scraper/scrape_99co.py

      # 실패해도 부동산 발송은 계속되어야 하므로 워크플로를 중단시키지 않는다.
      - name: 사업체 인수 매물 수집 (tempat-usaha.com)
        continue-on-error: true
        run: python scraper/scrape_business.py

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet js/live_data.js js/business_data.js; then
            echo "변경 사항 없음 - 커밋 생략"
            exit 0
          fi
          git add js/live_data.js js/business_data.js
          git commit -m "chore: auto-update listings ($(date -u +%Y-%m-%d))"
          git push

      # 2026-07-27: 발송 소스를 js/data.js(실재 확인 불가) → js/live_data.js(99.co 실수집)로
      # 교체하고 재개함. 반드시 위 '매물 수집' 스텝 뒤에 있어야 한다 —
      # telegram_recommend.py 는 live_data.js 가 48시간 이내 갱신된 경우에만 발송한다.
      - name: 텔레그램 매물 추천 (99.co 실매물 5건)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper/telegram_recommend.py

      - name: 로테이션 상태 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet scraper/telegram_state.json; then
            echo "변경 사항 없음 - 커밋 생략"
            exit 0
          fi
          git add scraper/telegram_state.json
          git commit -m "chore: update telegram rotation state ($(date -u +%Y-%m-%d))"
          git push
