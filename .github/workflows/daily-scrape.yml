name: 매물 자동 수집

on:
  schedule:
    # 매일 00:00 UTC = 한국 09:00 / 자카르타 07:00
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      telegram_only:
        # 추천 발송만 시험할 때 쓴다. 수집 스텝(인도웹만 40분+)을 건너뛰고 이미 커밋된
        # 데이터로 바로 발송한다. 텔레그램 토큰이 GitHub Secrets 에만 있어 로컬에서는 발송 테스트가 안 된다.
        description: "수집 없이 텔레그램 추천만 실행"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 인도웹 수집이 요청당 12초(사이트 보호)라 30분으로는 부족해졌다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 2026-08-15 이후 99.co 가 GitHub 러너 IP 에 403 을 반환해 수집 0건 → exit 1 로
      # 잡 전체가 중단됐다. 그 뒤의 인도웹·OLX 수집과 텔레그램 추천이 한 달간 한 번도
      # 돌지 않은 원인이다. 부동산 소스 하나가 막혀도 나머지는 계속 돌아야 한다
      # (낡은 부동산 데이터는 telegram_recommend.py 가 소스별 신선도로 걸러낸다).
      # 99.co·tempat-usaha.com 은 데이터센터 IP만 막혀 있어 scraper/daily_update.ps1
      # (로컬 PC 스케줄 작업)로 매일 별도 수집·커밋된다 — 여기서 0건이어도 정상이다.
      - name: 부동산 매물 수집 (99.co)
        if: ${{ !inputs.telegram_only }}
        id: co99
        continue-on-error: true
        run: python scraper/scrape_99co.py

      # OLX 는 GitHub 러너뿐 아니라 국내 가정용 회선에서도 연결이 끊기거나 타임아웃돼
      # (2026-09-15 로컬 재현 확인) 로컬 우회로도 해결되지 않는다. 원인 불명의 광범위한
      # 차단 — 현재는 소스가 복구될 때까지 실패를 기록만 하고 다음 소스로 넘어간다.
      - name: 사업체 인수 매물 수집 (OLX — 주력, 현재 차단됨)
        if: ${{ !inputs.telegram_only }}
        id: olx
        continue-on-error: true
        run: python scraper/scrape_olx.py

      - name: 사업체 인수 매물 수집 (tempat-usaha.com — 보조)
        if: ${{ !inputs.telegram_only }}
        id: business
        continue-on-error: true
        run: python scraper/scrape_business.py

      - name: 소스별 수집 결과 요약
        if: ${{ !inputs.telegram_only }}
        run: |
          summarize() {
            name="$1"; outcome="$2"; file="$3"
            if [ "$outcome" = "success" ]; then
              echo "✅ $name: 성공"
            else
              echo "❌ $name: 실패 (아래는 마지막으로 성공했을 때 저장된 데이터)"
            fi
            if [ -f "$file" ]; then
              echo "   $file 마지막 갱신: $(git log -1 --format=%cI -- "$file" 2>/dev/null || echo 알수없음)"
            fi
          }
          summarize "99.co" "${{ steps.co99.outcome }}" js/live_data.js
          summarize "OLX" "${{ steps.olx.outcome }}" js/olx_data.js
          summarize "tempat-usaha.com" "${{ steps.business.outcome }}" js/business_data.js

      # 한인 커뮤니티는 추천 1순위 소스다(한국인이 실제로 인수·운영하는 매물).
      # 다만 인도웹은 요청을 조여 실패가 잦으므로 워크플로를 중단시키지는 않는다.
      # 요청 간 12초 딜레이 + 상세 페이지 수집이라 시간이 걸린다(아래 timeout 참고).
      - name: 한인 커뮤니티 매물 수집 (indoweb.org — 1순위)
        if: ${{ !inputs.telegram_only }}
        continue-on-error: true
        run: python scraper/scrape_indoweb.py --pages 2

      - name: 변경 사항 커밋 & 푸시
        if: ${{ !inputs.telegram_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet js/live_data.js js/business_data.js js/olx_data.js js/community_data.js; then
            echo "변경 사항 없음 - 커밋 생략"
            exit 0
          fi
          git add js/live_data.js js/business_data.js js/olx_data.js js/community_data.js
          git commit -m "chore: auto-update listings ($(date -u +%Y-%m-%d))"
          git push

      # 2026-07-27: 발송 소스를 js/data.js(실재 확인 불가) → js/live_data.js(99.co 실수집)로
      # 교체하고 재개함. 반드시 위 '매물 수집' 스텝 뒤에 있어야 한다 —
      # telegram_recommend.py 는 live_data.js 가 48시간 이내 갱신된 경우에만 발송한다.
      - name: 텔레그램 매물 추천 (한인 커뮤니티 2 + 사업체 2 + 부동산)
        # 저장소 변수 TELEGRAM_ENABLED 가 'false' 면 발송을 건너뛴다(판정 로직 손보는 동안 일시 중지).
        # 재개: gh variable set TELEGRAM_ENABLED --body true
        if: ${{ vars.TELEGRAM_ENABLED != 'false' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 없으면 구글 실측 검증만 건너뛰고 나머지는 정상 동작한다.
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scraper/telegram_recommend.py

      # 매물 이력(가격 변동·체류 기간)과 Places 캐시는 실행 간에 유지돼야 의미가 있다.
      # 커밋하지 않으면 매 실행이 '첫 실행'이 되어 추적이 영원히 시작되지 않는다.
      - name: 발송 상태·매물 이력 커밋 & 푸시
        if: ${{ vars.TELEGRAM_ENABLED != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in scraper/telegram_state.json \
                   scraper/output/listing_history.json \
                   scraper/output/places_cache.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # 스테이징 후에 판단한다. 이력 파일은 첫 실행에서 '추적되지 않은 새 파일'이라
          # git diff(워킹트리)로는 변경이 안 보이고, 그대로면 영원히 커밋되지 않는다.
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "chore: update rotation state & listing history ($(date -u +%Y-%m-%d))"
          git push
